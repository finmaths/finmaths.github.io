<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" role="img" aria-label="Buy now pay later schedule of four payments with an account charge"><title>Buy now pay later schedule of four payments with an account charge</title><rect width="760" height="266" fill="#ffffff"/><text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#17365D" text-anchor="start" font-weight="bold">Buy now, pay later: a payment schedule</text><line x1="70" y1="112" x2="660" y2="112" stroke="#5B6573" stroke-width="2"/><circle cx="90" cy="112" r="14" fill="#1F7A8C"/><text x="90" y="68" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F7A8C" text-anchor="middle" font-weight="bold">$120</text><text x="90" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#C55A11" text-anchor="middle" font-weight="bold">+ $3 charge</text><text x="90" y="152" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="middle" font-weight="normal">Today (Day 0)</text><circle cx="270" cy="112" r="14" fill="#1F7A8C"/><text x="270" y="68" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F7A8C" text-anchor="middle" font-weight="bold">$120</text><text x="270" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#C55A11" text-anchor="middle" font-weight="bold">+ $3 charge</text><text x="270" y="152" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="middle" font-weight="normal">Day 14</text><circle cx="450" cy="112" r="14" fill="#1F7A8C"/><text x="450" y="68" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F7A8C" text-anchor="middle" font-weight="bold">$120</text><text x="450" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#C55A11" text-anchor="middle" font-weight="bold">+ $3 charge</text><text x="450" y="152" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="middle" font-weight="normal">Day 28</text><circle cx="630" cy="112" r="14" fill="#1F7A8C"/><text x="630" y="68" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1F7A8C" text-anchor="middle" font-weight="bold">$120</text><text x="630" y="88" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#C55A11" text-anchor="middle" font-weight="bold">+ $3 charge</text><text x="630" y="152" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="middle" font-weight="normal">Day 42</text><text x="20" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="bold">On time: 4 × $120 + 4 × $3 = $492</text><text x="400" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="bold">Additional cost: $12</text><text x="20" y="222" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="normal">If exactly one payment is late, the $10 late fee is added once: $502</text><text x="20" y="248" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="start" font-weight="normal">Task 8B. $480 headphones. Fictional offer. 'Interest-free' does not mean no charges.</text></svg>