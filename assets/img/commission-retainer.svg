<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Commission is 5% of sales, added to the retainer"><title>Commission is worked out on the $6,000 of sales, then added to the $400 retainer</title><rect width="760" height="250" fill="#ffffff"/><text x="20.0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#17365D" text-anchor="start" font-weight="bold">Jess's pay: a retainer plus commission</text><rect x="20" y="48" width="170" height="54" rx="6" fill="#E8F3F5" stroke="#1F7A8C" stroke-width="2"/><text x="105.0" y="69" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F7A8C" text-anchor="middle" font-weight="bold">Sales this week</text><text x="105.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#17365D" text-anchor="middle" font-weight="bold">$6,000</text><line x1="196" y1="75" x2="290" y2="75" stroke="#C55A11" stroke-width="3"/><polygon points="290,68 304,75 290,82" fill="#C55A11"/><text x="247.0" y="64" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C55A11" text-anchor="middle" font-weight="bold">× 5% (0.05)</text><rect x="308" y="48" width="170" height="54" rx="6" fill="#C55A11"/><text x="393.0" y="69" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Commission</text><text x="393.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">$300</text><text x="498.0" y="71" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B8312F" text-anchor="start" font-weight="bold">✗ Not 5% of the $400 retainer</text><text x="498.0" y="91" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#B8312F" text-anchor="start" font-weight="normal" font-style="italic">(that would give only $20)</text><rect x="20" y="120" width="358.0" height="46" rx="3" fill="#1F7A8C"/><text x="200.0" y="149" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Retainer $400 (paid whatever the sales)</text><rect x="380.0" y="120" width="270.0" height="46" rx="3" fill="#C55A11"/><text x="515.0" y="149" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Commission $300</text><path d="M20 176 v10 H650.0 v-10" fill="none" stroke="#17365D" stroke-width="2"/><text x="335.0" y="212" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#17365D" text-anchor="middle" font-weight="bold">Total pay = $400 + 0.05 × $6,000 = $400 + $300 = $700</text><text x="20.0" y="238" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="start" font-weight="normal">Worked example 1 (Jess). The figures are made up for classroom use.</text></svg>