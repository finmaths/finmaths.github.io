<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img" aria-label="Timeline of a deposit followed by 12 monthly repayments"><title>Timeline of a deposit followed by 12 monthly repayments</title><rect width="760" height="268" fill="#ffffff"/><text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#17365D" text-anchor="start" font-weight="bold">Deposit now, then regular repayments</text><line x1="60" y1="110" x2="694" y2="110" stroke="#5B6573" stroke-width="2"/><circle cx="60" cy="110" r="16" fill="#C55A11"/><text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C55A11" text-anchor="middle" font-weight="bold">Deposit $180</text><text x="60" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="middle" font-weight="normal">Today</text><circle cx="112" cy="110" r="10" fill="#1F7A8C"/><text x="112" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M1</text><circle cx="164" cy="110" r="10" fill="#1F7A8C"/><text x="164" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M2</text><circle cx="216" cy="110" r="10" fill="#1F7A8C"/><text x="216" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M3</text><circle cx="268" cy="110" r="10" fill="#1F7A8C"/><text x="268" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M4</text><circle cx="320" cy="110" r="10" fill="#1F7A8C"/><text x="320" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M5</text><circle cx="372" cy="110" r="10" fill="#1F7A8C"/><text x="372" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M6</text><circle cx="424" cy="110" r="10" fill="#1F7A8C"/><text x="424" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M7</text><circle cx="476" cy="110" r="10" fill="#1F7A8C"/><text x="476" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M8</text><circle cx="528" cy="110" r="10" fill="#1F7A8C"/><text x="528" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M9</text><circle cx="580" cy="110" r="10" fill="#1F7A8C"/><text x="580" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M10</text><circle cx="632" cy="110" r="10" fill="#1F7A8C"/><text x="632" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M11</text><circle cx="684" cy="110" r="10" fill="#1F7A8C"/><text x="684" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5B6573" text-anchor="middle" font-weight="normal">M12</text><text x="398.0" y="84" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1F7A8C" text-anchor="middle" font-weight="bold">12 monthly repayments of $75</text><text x="20" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="normal">Deposit: 20% of $900 = $180</text><text x="380" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="normal">Repayments: 12 × $75 = $900</text><text x="20" y="224" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="bold">Total paid: $180 + $900 = $1,080</text><text x="380" y="224" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="bold">Additional cost: $1,080 − $900 = $180</text><text x="20" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="start" font-weight="normal">Task 7B. Cash price $900. Fictional offer for classroom use.</text></svg>