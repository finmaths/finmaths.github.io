<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img" aria-label="Gross pay equals net pay plus tax withheld"><title>Gross pay equals net pay plus tax withheld</title><rect width="760" height="272" fill="#ffffff"/><text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#17365D" text-anchor="start" font-weight="bold">Gross pay, tax withheld and net pay</text><rect x="20" y="60" width="619.8499999999999" height="56" fill="#1F7A8C" rx="3"/><text x="329.92499999999995" y="94" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">Net pay (take-home) $539</text><rect x="641.8499999999999" y="60" width="61.4" height="56" fill="#C55A11" rx="3"/><text x="672.55" y="94" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">$36</text><text x="703.2499999999999" y="52" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C55A11" text-anchor="end" font-weight="bold">Tax withheld</text><path d="M20 132 v10 H703.2499999999999 v-10" fill="none" stroke="#17365D" stroke-width="2"/><text x="361.62499999999994" y="166" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17365D" text-anchor="middle" font-weight="bold">Gross pay $575</text><text x="20" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="normal">Gross pay − tax withheld = net pay</text><text x="20" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="bold">$575 − $36 = $539</text><text x="20" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="start" font-weight="normal">Ella's week from Lesson 2. Tax withheld read from the ATO Weekly tax table (NAT 1005, from 1 July 2026).</text></svg>