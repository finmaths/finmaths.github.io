<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Total repaid equals the principal plus the establishment and monthly fees"><title>Total repaid equals the principal plus the establishment and monthly fees</title><rect width="760" height="280" fill="#ffffff"/><text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#17365D" text-anchor="start" font-weight="bold">Total repaid = amount borrowed + fees</text><rect x="20" y="70" width="570.0" height="56" fill="#1F7A8C" rx="3"/><text x="305.0" y="105" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">Principal $600</text><rect x="592.0" y="70" width="57.0" height="56" fill="#C55A11" rx="3"/><text x="620.5" y="105" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">$60</text><rect x="651.0" y="70" width="30.799999999999997" height="56" fill="#E39A5C" rx="3"/><text x="666.4" y="105" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">$24</text><path d="M592.0 64 v-8 H681.8 v8" fill="none" stroke="#C55A11" stroke-width="2"/><text x="596.9" y="50" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#C55A11" text-anchor="middle" font-weight="bold">Borrowing cost $84</text><path d="M20 136 v10 H681.8 v-10" fill="none" stroke="#17365D" stroke-width="2"/><text x="350.9" y="170" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#17365D" text-anchor="middle" font-weight="bold">Total repaid $684 (2 repayments of $342)</text><text x="20" y="214" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#17365D" text-anchor="start" font-weight="normal">Establishment fee: 10% of $600 = $60</text><text x="360" y="214" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#17365D" text-anchor="start" font-weight="normal">Monthly fee: 2% of $600 = $12, × 2 months = $24</text><text x="20" y="240" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="bold">Borrowing cost = total repaid − principal = $684 − $600 = $84</text><text x="20" y="264" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5B6573" text-anchor="start" font-weight="normal">Task 9B. Fictional loan for classroom use, not real market rates.</text></svg>