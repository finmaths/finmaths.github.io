<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Time and a half and double time compared with the base rate"><title>Time and a half and double time compared with the base rate</title><rect width="760" height="300" fill="#ffffff"/><text x="20" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#17365D" text-anchor="start" font-weight="bold">Penalty rates multiply the base rate</text><text x="20" y="88" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="normal">Base rate (× 1)</text><rect x="210" y="62" width="198" height="38" fill="#1F7A8C" rx="3"/><text x="310.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">$25</text><text x="422" y="88" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#17365D" text-anchor="start" font-weight="bold">$25.00 per hour</text><text x="20" y="148" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="normal">Time and a half (× 1.5)</text><rect x="210" y="122" width="198" height="38" fill="#1F7A8C" rx="3"/><text x="310.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">$25</text><rect x="410" y="122" width="98.0" height="38" fill="#C55A11" rx="3"/><text x="460.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">+ $12.50</text><text x="522.0" y="148" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#17365D" text-anchor="start" font-weight="bold">$37.50 per hour</text><text x="20" y="208" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#17365D" text-anchor="start" font-weight="normal">Double time (× 2)</text><rect x="210" y="182" width="198" height="38" fill="#1F7A8C" rx="3"/><text x="310.0" y="207" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">$25</text><rect x="410" y="182" width="198" height="38" fill="#C55A11" rx="3"/><text x="510.0" y="207" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">+ $25</text><text x="622" y="208" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#17365D" text-anchor="start" font-weight="bold">$50.00 per hour</text><text x="20" y="262" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5B6573" text-anchor="start" font-weight="normal">Example: base rate $25 per hour.</text><text x="20" y="284" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5B6573" text-anchor="start" font-weight="normal">Time and a half = $25 × 1.5 = $37.50, not $25 + $1.50.</text></svg>